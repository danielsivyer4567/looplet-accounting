name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to use
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      project_ref:
        description: Supabase project ref
        required: true
        default: dxoikltymmknxqpkpyhi
      deploy_edge_functions:
        description: Deploy default edge-function inventory after gates pass
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Least privilege, SHA-pinned actions (tag in the trailing comment), and the gates run in a job that
# holds no deploy secrets. The Supabase access token and database password only reach the second job,
# which runs after the gates pass and does not build or test. See ci.yml for the August 2026 incident.
permissions:
  contents: read

env:
  NODE_VERSION: '20'
  SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build-config integrity check
        run: node scripts/check-build-config-integrity.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Accounting tests
        run: npm run test:accounting

      - name: Deployment docs reconciliation
        run: npx vitest run src/test/db/deploymentDocsReconciliation.test.ts

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://dxoikltymmknxqpkpyhi.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

  preflight:
    name: Migration Dry Run, Optional Functions
    runs-on: ubuntu-latest
    needs: gates
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build-config integrity check
        run: node scripts/check-build-config-integrity.mjs

      # Installs the pinned Supabase CLI from the lockfile. Nothing here builds or tests the app.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Migration dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase migration list --linked
          npx supabase db push --linked --dry-run

      - name: Deploy default edge functions
        if: ${{ inputs.deploy_edge_functions == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node -e "const fs=require('fs'); const inv=JSON.parse(fs.readFileSync('supabase/functions-inventory.json','utf8')); for (const fn of inv.functions.filter((item)=>item.deploy_by_default)) console.log(fn.name)" > /tmp/edge-functions.txt
          while read -r fn; do
            echo "Deploying $fn"
            npx supabase functions deploy "$fn" --use-api --project-ref "$SUPABASE_PROJECT_REF"
          done < /tmp/edge-functions.txt
