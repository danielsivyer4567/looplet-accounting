name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. In August 2026 an implant in this repo's build config ran during CI builds while the
# deploy secrets were in the same job. Now:
# - every job only reads the repository, and a job asks for more only where it needs it (none do today);
# - third-party actions are pinned to full commit SHAs (the tag is in the trailing comment), so a moved
#   or hijacked tag cannot change what runs here;
# - build and test never see deploy secrets: the deploy job runs no repository code and only uploads
#   the files the build job produced.
permissions:
  contents: read

env:
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build-config integrity check
        run: node scripts/check-build-config-integrity.mjs

      # No dependency in the lockfile needs an install script on Linux; refusing them closes the
      # install-time route for a compromised package.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        env:
          # The build job runs local unit/source-contract tests. Live Supabase
          # deploy gates live in dedicated jobs and fail hard when their real
          # secrets are missing; keep this broad unit sweep deterministic on PRs.
          CI: ''
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://dxoikltymmknxqpkpyhi.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
        run: npm test

      - name: Accounting engine tests
        run: npm run test:accounting

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://dxoikltymmknxqpkpyhi.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # The deploy job publishes exactly these files; it never builds.
      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  tenant-isolation:
    name: Tenant Isolation (Deploy Blocker)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    # This job MUST be green for any deploy. Cross-tenant leak = P0.
    # See docs/ROADMAP.md → Foundational Disciplines → Multi-tenancy.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build-config integrity check
        run: node scripts/check-build-config-integrity.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tenant-isolation suite
        run: npm run test:tenant-isolation
        env:
          # In CI, a missing/rotated secret here makes the suite FAIL HARD
          # (not silently skip) — see tests/tenant-isolation.test.ts.
          CI: 'true'
          VITE_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL || 'https://dxoikltymmknxqpkpyhi.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [build, tenant-isolation]
    # Only deploy on direct pushes to main — not on PRs.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    # This is the only job that holds the Cloudflare secrets. It runs no repository code: no install,
    # no build, no tests. It checks out wrangler.toml alone (the Pages project config) and publishes
    # the dist artifact from the build job.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: wrangler.toml
          sparse-checkout-cone-mode: false

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=looplet-accounting --branch=main
