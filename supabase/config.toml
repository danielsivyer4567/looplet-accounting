# Supabase CLI config for the looplet-accounting project.
# Run `supabase link --project-ref dxoikltymmknxqpkpyhi` to bind to live.
# Kept minimal for CLI v1 compatibility — link/deploy only need project_id.

project_id = "dxoikltymmknxqpkpyhi"

# Connector API (EPIC F). These functions authenticate via external API keys
# (Authorization: Bearer llp_<prefix>.<secret>), NOT a Supabase JWT, so the
# platform JWT gate must be off — they validate the presented key themselves.
[functions.api-gateway]
verify_jwt = false

[functions.ingest]
verify_jwt = false

[functions.receipt-webhook]
verify_jwt = false

[functions.receipt-sync-dispatch]
verify_jwt = false

# Cron-driven functions (EPIC C2 / Phase 1.G/1.I). pg_cron drives these via
# net.http_post and authenticates with the service-role bearer or a ?secret=
# cron secret that the function checks itself, so the platform JWT gate is off.
[functions.depreciation-run]
verify_jwt = false

[functions.accruals-run]
verify_jwt = false

# legal-corpus-sync (SC-LC.E.04): the legal-RAG auto-updater, driven by pg_cron
# (0112_legal_corpus_sync_cron.sql) via net.http_post with a ?secret= cron secret.
[functions.legal-corpus-sync]
verify_jwt = false

# legal-horizon-scan (SC-LC.F.03): the 3-hourly Sonar horizon scanner, driven by
# pg_cron (0114_horizon_cron_reconcile.sql) via net.http_post with a ?secret= cron secret.
[functions.legal-horizon-scan]
verify_jwt = false

# advisor (SC-6.B.02): user-invoked proactive advisory engine. JWT stays on;
# the function forwards the caller token into Supabase so RLS/RPC org checks apply.
[functions.advisor]
verify_jwt = true
