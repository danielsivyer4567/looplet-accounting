# Supabase CLI config for the looplet-accounting project.
# Run `supabase link --project-ref dxoikltymmknxqpkpyhi` to bind to live.

project_id = "dxoikltymmknxqpkpyhi"

[db]
# Local Postgres (only used by `supabase start` for offline dev)
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions]
enabled = true
verify_jwt = true
