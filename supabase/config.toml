# Supabase CLI config for the looplet-accounting project.
# Run `supabase link --project-ref dxoikltymmknxqpkpyhi` to bind to live.
# Kept minimal for CLI v1 compatibility — link/deploy only need project_id.

project_id = "dxoikltymmknxqpkpyhi"

# Connector API (EPIC F). These functions authenticate via external API keys
# (Authorization: Bearer llp_<prefix>.<secret>), NOT a Supabase JWT, so the
# platform JWT gate must be off — they validate the presented key themselves.
[functions.api-gateway]
verify_jwt = false

[functions.ingest]
verify_jwt = false

[functions.receipt-webhook]
verify_jwt = false

[functions.receipt-sync-dispatch]
verify_jwt = false

# Gmail Pub/Sub push does not carry a Supabase JWT. It fails closed on the
# GMAIL_PUSH_VERIFY_TOKEN query secret before processing the Google payload.
[functions.gmail-pubsub-push]
verify_jwt = false

# Cron fan-out endpoint; self-authenticates with BANK_SYNC_ALL_CRON_SECRET or
# the exact service-role bearer before reading org IDs.
[functions.bank-sync-all]
verify_jwt = false

# Nightly notification worker; self-authenticates with NOTIFICATIONS_CRON_SECRET
# or the exact service-role bearer before scanning orgs.
[functions.notifications-cron]
verify_jwt = false

# Accountant activity digest cron is called by pg_cron with a scoped
# ACCOUNTANT_SESSION_DIGEST_CRON_SECRET. Browser/on-demand paths still verify
# the caller JWT inside the function before reading sessions or activity.
[functions.accountant-session-digest]
verify_jwt = false

# Inbound-email webhook for accountants. The inbound-email provider POSTs here
# with no Supabase JWT, so the platform gate is off; the function fails CLOSED on
# the x-inbound-secret header (EMAIL_INBOUND_SECRET) before doing anything.
[functions.accountant-email-query]
verify_jwt = false

# Basiq webhook receiver. Basiq sends no Supabase JWT; the function fails closed
# on the BASIQ_WEBHOOK_VERIFY_TOKEN URL query secret before processing the event.
[functions.bank-webhook]
verify_jwt = false

# Autopilot reconciliation. pg_cron drives it via service-role bearer or a
# ?secret=<AUTO_RECONCILE_CRON_SECRET>; user-JWT callers fall through to an
# RLS org-access check. Platform JWT gate off so cron can reach it (migration 0065).
[functions.auto-reconcile]
verify_jwt = false

# Gmail watch renewal cron. pg_cron drives it via service-role bearer or a
# ?secret=<GMAIL_WATCH_RENEW_CRON_SECRET>; both checked constant-time, else 403.
[functions.gmail-watch-renew]
verify_jwt = false

# Final-pay calculator. Self-authenticates via getUser + org membership (like the
# other payroll fns), so the platform JWT gate is off and the function does its own auth.
[functions.payroll-termination]
verify_jwt = false

# TFN vault writer. Self-authenticates via getUser + org membership so it can
# encrypt before writing service-role-only employee_tfn_vault rows.
[functions.employee-tfn-save]
verify_jwt = false

# Quarterly super batch send (Tier-2 approval gated). Self-authenticates via
# getUser + membership (like payment-runs-aba-export), so the platform JWT gate is off.
[functions.super-batch-send]
verify_jwt = false

# Cron-driven functions (EPIC C2 / Phase 1.G/1.I). pg_cron drives these via
# net.http_post and authenticates with the service-role bearer or a ?secret=
# cron secret that the function checks itself, so the platform JWT gate is off.
[functions.depreciation-run]
verify_jwt = false

[functions.accruals-run]
verify_jwt = false

# legal-corpus-ingest (SC-LC.C.02): operator seed endpoint for global legal reference
# data. It self-authenticates with the service-role bearer or LEGAL_INGEST_SECRET.
[functions.legal-corpus-ingest]
verify_jwt = false

# legal-corpus-sync (SC-LC.E.04): the legal-RAG auto-updater, driven by pg_cron
# (0112_legal_corpus_sync_cron.sql) via net.http_post with a ?secret= cron secret.
[functions.legal-corpus-sync]
verify_jwt = false

# legal-horizon-scan (SC-LC.F.03): the 3-hourly Sonar horizon scanner, driven by
# pg_cron (0114_horizon_cron_reconcile.sql) via net.http_post with a ?secret= cron secret.
[functions.legal-horizon-scan]
verify_jwt = false

# legal-horizon-run: user-invoked scan trigger. JWT stays on; the function verifies
# accountant/admin/owner membership before proxying to the backend-only scanner.
[functions.legal-horizon-run]
verify_jwt = true

# advisor (SC-6.B.02): user-invoked proactive advisory engine. JWT stays on;
# the function forwards the caller token into Supabase so RLS/RPC org checks apply.
[functions.advisor]
verify_jwt = true

# bank-job-poll: user-invoked Basiq job poller. JWT stays on; the RLS check ensures
# the caller owns the org before touching Basiq.
[functions.bank-job-poll]
verify_jwt = true

# bas-worksheet-pdf (SC-3.D.01): user-invoked BAS worksheet renderer. JWT stays on;
# the SECURITY-INVOKER RPC runs through a caller-scoped client so RLS scopes the worksheet.
[functions.bas-worksheet-pdf]
verify_jwt = true

# eofy-pack (SC-4.C.01): user-invoked EOFY pack assembler. JWT stays on; every RPC is
# SECURITY INVOKER through a caller-scoped client so RLS scopes the pack to the caller's orgs.
[functions.eofy-pack]
verify_jwt = true

# trust-minute (SC-5.D.01): user-invoked trustee-resolution PDF. JWT stays on; reads run
# through a caller-scoped client so RLS scopes every row to the caller's orgs.
[functions.trust-minute]
verify_jwt = true

# div7a-agreement (SC-5.F.01): user-invoked Div 7A agreement PDF. JWT stays on; the loan
# read runs through a caller-scoped client so RLS scopes it to the caller's orgs.
[functions.div7a-agreement]
verify_jwt = true
