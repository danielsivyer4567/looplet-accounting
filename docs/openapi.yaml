openapi: 3.1.0
info:
  title: Looplet Accounting Connector API
  version: '1.0.0'
  description: >
    External connector API for Looplet Accounting. Two surfaces:

      1. **Read API** — Supabase PostgREST at `/rest/v1`. Authenticate with a
         short-lived org-scoped JWT obtained from `POST /functions/v1/api-gateway`.
         Row-Level Security scopes every read to the key's organization.

      2. **Ingest API** — `POST /functions/v1/ingest` pushes bills, bank
         transactions, and invoices in. Authenticated directly with the API key.
         Records are pinned to the key's organization and run through the same
         auto-routing as the in-app importers (bill auto-attach/suggest/queue,
         bank-transaction dedupe, intake rules).

      3. **POS Receipt API** — `POST /functions/v1/receipt-webhook` pushes
         structured merchant receipts from POS webhooks, plugins, or bridge
         middleware. Authenticated directly with an API key that has
         `write:receipts`.

    All API keys are organization-bound. The raw service-role key is NEVER
    accepted at the edge. Every external call is rate-limited per key and logged
    to `api_request_log`.
servers:
  - url: https://dxoikltymmknxqpkpyhi.supabase.co
    description: Production
tags:
  - name: auth
    description: API-key → JWT exchange
  - name: ingest
    description: Push records in
  - name: receipts
    description: Push structured POS receipts in
  - name: read
    description: PostgREST read API (org-scoped by RLS)

components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: >
        External API key, presented as `Authorization: Bearer llp_<prefix>.<secret>`.
        Issue via the `issue_api_key` RPC; revoke via `revoke_api_key`.
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived (15 min) org-scoped JWT returned by `/functions/v1/api-gateway`.
        Carries `role=connector` and an `organization_id` claim that RLS honours.
        The connector Postgres role is SELECT-only; writes must use scoped ingest
        endpoints.
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    TokenResponse:
      type: object
      properties:
        access_token: { type: string, description: Short-lived org-scoped JWT }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: TTL in seconds (900) }
        organization_id: { type: string, format: uuid }
      required: [access_token, token_type, expires_in, organization_id]
    IngestRequest:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [bill, bank_transaction, invoice]
        payload:
          type: object
          description: Type-specific body. organization_id is ignored if present (pinned to the key).
          oneOf:
            - $ref: '#/components/schemas/BillPayload'
            - $ref: '#/components/schemas/BankTransactionPayload'
            - $ref: '#/components/schemas/InvoicePayload'
    IngestResponse:
      type: object
      properties:
        ok: { type: boolean }
        id: { type: [string, 'null'], format: uuid }
        type: { type: string }
        deduped: { type: boolean, description: true if this was an idempotent re-push }
        routing:
          type: object
          nullable: true
          description: Bill router outcome (bills only).
          properties:
            outcome: { type: string, enum: [auto_attached, suggested, queued] }
            matched_job_id: { type: string, format: uuid }
            match_score: { type: number }
      required: [ok]
    BillPayload:
      type: object
      description: Scope required - write:bills. Dedup on org + content hash and UNIQUE(org, supplier_id, invoice_number).
      properties:
        supplier_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        supplier_name_raw: { type: string }
        supplier_abn: { type: string }
        invoice_number: { type: string }
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }
        total_inc_gst_cents: { type: integer }
        gst_cents: { type: integer }
        subtotal_ex_gst_cents: { type: integer }
        currency_code: { type: string, default: AUD }
        job_reference_raw: { type: string, description: Drives auto-attach to a job. }
        notes: { type: string }
        raw_extracted: { type: object }
        storage_key: { type: string, description: Optional; synthesised if absent. }
        original_filename: { type: string }
        mime_type: { type: string }
    BankTransactionPayload:
      type: object
      description: Scope required - write:bank. Idempotent on (bank_account_id, external_id).
      required: [bank_account_id, external_id]
      properties:
        bank_account_id: { type: string, format: uuid, description: Must belong to the key's org. }
        external_id: { type: string, description: Stable source id; the dedup key. }
        posted_at: { type: string, format: date-time }
        description: { type: string }
        amount_cents: { type: integer, description: Signed; positive = money in. }
        running_balance_cents: { type: integer }
        reference: { type: string }
        category_external: { type: string }
        raw: { type: object }
    InvoicePayload:
      type: object
      description: Scope required - write:invoices. Dedup on UNIQUE(org, invoice_number).
      required: [invoice_number, customer_id, due_date]
      properties:
        invoice_number: { type: string }
        customer_id: { type: string, format: uuid, description: Must belong to the key's org. }
        job_id: { type: string, format: uuid }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date }
        terms_days: { type: integer, default: 14 }
        subtotal_ex_gst_cents: { type: integer }
        gst_cents: { type: integer }
        total_inc_gst_cents: { type: integer }
        currency_code: { type: string, default: AUD }
        notes: { type: string }
        status: { type: string, enum: [draft, sent, partially_paid, paid, overdue, void] }
    ReceiptWebhookRequest:
      type: object
      description: >
        Scope required - write:receipts. The API key pins organization_id. The
        receipt identity token links the checkout to a Looplet receipt pass/tag.
      required: [identity_token, payload]
      properties:
        organization_id:
          type: string
          format: uuid
          description: Optional for app-simulator JWT calls; ignored for API-key calls.
        identity_token:
          type: string
          example: rhp_1234abcd.0123456789abcdef
        idempotency_key:
          type: string
          description: Stable POS payment/receipt event id. If also sent as the Idempotency-Key header, the values must match.
        event_type:
          type: string
          enum: [sale, refund, void]
          default: sale
          description: Completed POS lifecycle event. Only sale events create bills.
        source_channel:
          type: string
          enum: [phone-pass, tag, pos, epost, email, photo, manual]
          default: pos
        payload:
          $ref: '#/components/schemas/ReceiptPayload'
        sync_targets:
          type: array
          items: { type: string, enum: [xero, myob, quickbooks, generic_api] }
    ReceiptPayload:
      type: object
      required: [merchant, receipt, line_items]
      properties:
        merchant:
          type: object
          required: [name]
          properties:
            name: { type: string, example: Bunnings Trade }
            abn: { type: string, example: '12123456789' }
            external_id: { type: string, example: store-017 }
        receipt:
          type: object
          description: POS receipts must include purchase_at, total_inc_gst_cents, subtotal_ex_gst_cents, gst_cents, tender_status, and payment_reference; subtotal + GST must reconcile to total_inc_gst_cents.
          required:
            [
              purchase_at,
              subtotal_ex_gst_cents,
              gst_cents,
              total_inc_gst_cents,
              tender_status,
              payment_reference,
            ]
          properties:
            number: { type: string, example: POS-2026-0001 }
            idempotency_key: { type: string }
            external_id: { type: string }
            external_event_id: { type: string, example: payment-evt-100042 }
            event_type: { type: string, enum: [sale, refund, void], default: sale }
            original_receipt_number:
              type: string
              description: Required for refund/void events unless original_external_event_id is supplied.
            original_external_event_id:
              type: string
              description: Required for refund/void events unless original_receipt_number is supplied.
            purchase_at:
              type: string
              format: date-time
              description: Required for POS receipts. Use the original POS/EFTPOS completed tender timestamp, not bridge send time.
            currency: { type: string, default: AUD }
            subtotal_ex_gst_cents: { type: integer, description: Required for POS receipts. }
            gst_cents: { type: integer, description: Required for POS receipts. }
            total_inc_gst_cents: { type: integer, minimum: 0 }
            tender_status:
              type: string
              description: Final tender state, e.g. completed, refunded, or voided.
            payment_method: { type: string, example: card }
            payment_last4:
              type: string
              example: '1234'
              description: Optional card last four only. Full card numbers are rejected before storage.
              pattern: '^[0-9]{4}$'
            payment_reference:
              type: string
              example: eftpos-auth-777331
              description: Required for POS receipts. Use the EFTPOS/POS authorization id, transaction id, or cash-drawer sequence.
            terminal_id: { type: string, example: TERM-04 }
            store_id: { type: string, example: STORE-017 }
            location: { type: object }
        classification:
          type: object
          properties:
            business_use: { type: string, enum: [business, personal, mixed] }
            deductibility: { type: string, enum: [deductible, non_deductible, requires_review] }
            job_reference: { type: string }
            job_id: { type: string, format: uuid }
            category: { type: string }
            sync_targets:
              type: array
              items: { type: string, enum: [xero, myob, quickbooks, generic_api] }
        external_event_id:
          type: string
          description: Fallback idempotency source if header/body key is absent.
        line_items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReceiptLineItem'
    ReceiptLineItem:
      type: object
      required: [total_inc_gst_cents, gst_cents]
      properties:
        description: { type: string }
        quantity: { type: number }
        unit_price_cents: { type: integer }
        total_inc_gst_cents: { type: integer }
        gst_cents:
          {
            type: integer,
            description: Required for POS receipts. Line GST must reconcile to receipt.gst_cents.,
          }
        category: { type: string }
    ReceiptWebhookResponse:
      type: object
      properties:
        ok: { type: boolean }
        duplicate:
          type: boolean
          description: true when the same stable idempotency key was already processed.
        event_type: { type: string, enum: [sale, refund, void] }
        receipt_event_id: { type: string, format: uuid }
        related_receipt_event_id: { type: [string, 'null'], format: uuid }
        bill_id: { type: [string, 'null'], format: uuid }
        audit_package_id: { type: string, format: uuid }
        sync_jobs:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              provider: { type: string, enum: [xero, myob, quickbooks, generic_api] }
              status: { type: string }
        classification:
          type: object
          properties:
            business_use: { type: string }
            deductibility_status: { type: string }
            job_id: { type: [string, 'null'], format: uuid }
            job_reference: { type: [string, 'null'] }
            gst_estimated: { type: boolean }
            reason: { type: string }
      required: [ok, duplicate, receipt_event_id]

paths:
  /functions/v1/api-gateway:
    post:
      tags: [auth]
      summary: Exchange an API key for a short-lived org-scoped JWT
      description: >
        Validates the presented API key (SHA-256 hash lookup), then mints a
        15-minute JWT with `role=connector` and the key's `organization_id`
        claim. Use the returned token as a bearer against `/rest/v1` — RLS scopes
        all reads to that organization and the SELECT-only connector role denies
        direct PostgREST writes. Rate-limited per key; logged.
      security:
        - ApiKey: []
      responses:
        '200':
          description: Token minted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Invalid or revoked API key
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Per-key rate limit exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /functions/v1/ingest:
    post:
      tags: [ingest]
      summary: Push a bill, bank transaction, or invoice
      description: >
        Authenticated by API key. organization_id is pinned to the key (any value
        in the body is ignored). Re-pushes are idempotent. Bills are auto-routed
        (attach/suggest/queue) and fed to the intake-rules engine, identical to the
        Gmail/CSV importers.
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestRequest' }
      responses:
        '200':
          description: Accepted (idempotent re-push of an existing record)
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestResponse' } } }
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestResponse' } } }
        '400':
          description: Invalid JSON, unsupported type, or validation failure
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401':
          description: Invalid or revoked API key
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: Key lacks the required scope for this type
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Per-key rate limit exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /functions/v1/receipt-webhook:
    post:
      tags: [receipts]
      summary: Push a structured POS receipt
      description: >
        Authenticated by API key with `write:receipts`. The payload is pinned to
        the key's organization, validates an active receipt identity token, checks
        receipt totals, creates receipt/bill/audit rows, and queues downstream
        sync jobs. Safe retries with the same `Idempotency-Key` return the
        existing `receipt_event_id` with `duplicate=true`. `sale` events can
        create bills; `refund` and `void` events are stored as audit evidence
        until an explicit accounting-credit workflow handles them.
      security:
        - ApiKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 160 }
          description: Stable POS payment/receipt event id. Strongly recommended.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptWebhookRequest' }
      responses:
        '200':
          description: Accepted, including idempotent duplicate retries
          content:
            {
              application/json: { schema: { $ref: '#/components/schemas/ReceiptWebhookResponse' } },
            }
        '400':
          description: Invalid JSON, inactive identity token, missing retry key, bad totals, or validation failure
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401':
          description: Missing, malformed, expired, or revoked API key
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: Key lacks write:receipts
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Per-key rate limit exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500':
          description: Receipt ingest failed after authentication and validation
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /rest/v1/{table}:
    get:
      tags: [read]
      summary: Read any org-scoped table/view via PostgREST
      description: >
        Standard Supabase PostgREST. Send the JWT from `/functions/v1/api-gateway`
        as `Authorization: Bearer <jwt>` AND the project anon key as the `apikey`
        header. RLS restricts every row to the token's organization. Supports the
        full PostgREST query grammar (`select`, filters, `order`, `limit`, etc).
        Examples of readable resources: `bills`, `invoices`, `bank_transactions`,
        `jobs`, `customers`, `suppliers`, and reporting views (`v_customer_pnl`, ...).
      security:
        - BearerJWT: []
      parameters:
        - {
            name: table,
            in: path,
            required: true,
            schema: { type: string },
            description: Table or view name,
          }
        - {
            name: select,
            in: query,
            required: false,
            schema: { type: string },
            example: 'id,invoice_number,total_inc_gst_cents',
          }
        - {
            name: order,
            in: query,
            required: false,
            schema: { type: string },
            example: 'issue_date.desc',
          }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: Array of org-scoped rows
          content: { application/json: { schema: { type: array, items: { type: object } } } }
        '401':
          description: Missing/expired JWT
