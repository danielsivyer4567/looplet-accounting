openapi: 3.1.0
info:
  title: Looplet Accounting Connector API
  version: "1.0.0"
  description: >
    External connector API for Looplet Accounting. Two surfaces:

      1. **Read API** — Supabase PostgREST at `/rest/v1`. Authenticate with a
         short-lived org-scoped JWT obtained from `POST /functions/v1/api-gateway`.
         Row-Level Security scopes every read to the key's organization.

      2. **Ingest API** — `POST /functions/v1/ingest` pushes bills, bank
         transactions, and invoices in. Authenticated directly with the API key.
         Records are pinned to the key's organization and run through the same
         auto-routing as the in-app importers (bill auto-attach/suggest/queue,
         bank-transaction dedupe, intake rules).

    All API keys are organization-bound. The raw service-role key is NEVER
    accepted at the edge. Every external call is rate-limited per key and logged
    to `api_request_log`.
servers:
  - url: https://dxoikltymmknxqpkpyhi.supabase.co
    description: Production
tags:
  - name: auth
    description: API-key → JWT exchange
  - name: ingest
    description: Push records in
  - name: read
    description: PostgREST read API (org-scoped by RLS)

components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: >
        External API key, presented as `Authorization: Bearer llp_<prefix>.<secret>`.
        Issue via the `issue_api_key` RPC; revoke via `revoke_api_key`.
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived (15 min) org-scoped JWT returned by `/functions/v1/api-gateway`.
        Carries `role=authenticated` and an `organization_id` claim that RLS honours.
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    TokenResponse:
      type: object
      properties:
        access_token: { type: string, description: Short-lived org-scoped JWT }
        token_type:   { type: string, enum: [Bearer] }
        expires_in:   { type: integer, description: TTL in seconds (900) }
        organization_id: { type: string, format: uuid }
      required: [access_token, token_type, expires_in, organization_id]
    IngestRequest:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [bill, bank_transaction, invoice]
        payload:
          type: object
          description: Type-specific body. organization_id is ignored if present (pinned to the key).
          oneOf:
            - $ref: '#/components/schemas/BillPayload'
            - $ref: '#/components/schemas/BankTransactionPayload'
            - $ref: '#/components/schemas/InvoicePayload'
    IngestResponse:
      type: object
      properties:
        ok:      { type: boolean }
        id:      { type: [string, "null"], format: uuid }
        type:    { type: string }
        deduped: { type: boolean, description: true if this was an idempotent re-push }
        routing:
          type: object
          nullable: true
          description: Bill router outcome (bills only).
          properties:
            outcome: { type: string, enum: [auto_attached, suggested, queued] }
            matched_job_id: { type: string, format: uuid }
            match_score: { type: number }
      required: [ok]
    BillPayload:
      type: object
      description: Scope required - write:bills. Dedup on org + content hash and UNIQUE(org, supplier_id, invoice_number).
      properties:
        supplier_id:           { type: string, format: uuid }
        job_id:                { type: string, format: uuid }
        supplier_name_raw:     { type: string }
        supplier_abn:          { type: string }
        invoice_number:        { type: string }
        invoice_date:          { type: string, format: date }
        due_date:              { type: string, format: date }
        total_inc_gst_cents:   { type: integer }
        gst_cents:             { type: integer }
        subtotal_ex_gst_cents: { type: integer }
        currency_code:         { type: string, default: AUD }
        job_reference_raw:     { type: string, description: Drives auto-attach to a job. }
        notes:                 { type: string }
        raw_extracted:         { type: object }
        storage_key:           { type: string, description: Optional; synthesised if absent. }
        original_filename:     { type: string }
        mime_type:             { type: string }
    BankTransactionPayload:
      type: object
      description: Scope required - write:bank. Idempotent on (bank_account_id, external_id).
      required: [bank_account_id, external_id]
      properties:
        bank_account_id:       { type: string, format: uuid, description: Must belong to the key's org. }
        external_id:           { type: string, description: Stable source id; the dedup key. }
        posted_at:             { type: string, format: date-time }
        description:           { type: string }
        amount_cents:          { type: integer, description: Signed; positive = money in. }
        running_balance_cents: { type: integer }
        reference:             { type: string }
        category_external:     { type: string }
        raw:                   { type: object }
    InvoicePayload:
      type: object
      description: Scope required - write:invoices. Dedup on UNIQUE(org, invoice_number).
      required: [invoice_number, customer_id, due_date]
      properties:
        invoice_number:        { type: string }
        customer_id:           { type: string, format: uuid, description: Must belong to the key's org. }
        job_id:                { type: string, format: uuid }
        issue_date:            { type: string, format: date }
        due_date:              { type: string, format: date }
        terms_days:            { type: integer, default: 14 }
        subtotal_ex_gst_cents: { type: integer }
        gst_cents:             { type: integer }
        total_inc_gst_cents:   { type: integer }
        currency_code:         { type: string, default: AUD }
        notes:                 { type: string }
        status:                { type: string, enum: [draft, sent, partially_paid, paid, overdue, void] }

paths:
  /functions/v1/api-gateway:
    post:
      tags: [auth]
      summary: Exchange an API key for a short-lived org-scoped JWT
      description: >
        Validates the presented API key (SHA-256 hash lookup), then mints a
        15-minute JWT with `role=authenticated` and the key's `organization_id`
        claim. Use the returned token as a bearer against `/rest/v1` — RLS scopes
        all reads to that organization. Rate-limited per key; logged.
      security:
        - ApiKey: []
      responses:
        "200":
          description: Token minted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "401":
          description: Invalid or revoked API key
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "429":
          description: Per-key rate limit exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /functions/v1/ingest:
    post:
      tags: [ingest]
      summary: Push a bill, bank transaction, or invoice
      description: >
        Authenticated by API key. organization_id is pinned to the key (any value
        in the body is ignored). Re-pushes are idempotent. Bills are auto-routed
        (attach/suggest/queue) and fed to the intake-rules engine, identical to the
        Gmail/CSV importers.
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestRequest' }
      responses:
        "200":
          description: Accepted (idempotent re-push of an existing record)
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestResponse' } } }
        "201":
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/IngestResponse' } } }
        "400":
          description: Invalid JSON, unsupported type, or validation failure
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "401":
          description: Invalid or revoked API key
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "403":
          description: Key lacks the required scope for this type
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "429":
          description: Per-key rate limit exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /rest/v1/{table}:
    get:
      tags: [read]
      summary: Read any org-scoped table/view via PostgREST
      description: >
        Standard Supabase PostgREST. Send the JWT from `/functions/v1/api-gateway`
        as `Authorization: Bearer <jwt>` AND the project anon key as the `apikey`
        header. RLS restricts every row to the token's organization. Supports the
        full PostgREST query grammar (`select`, filters, `order`, `limit`, etc).
        Examples of readable resources: `bills`, `invoices`, `bank_transactions`,
        `jobs`, `customers`, `suppliers`, and reporting views (`v_customer_pnl`, ...).
      security:
        - BearerJWT: []
      parameters:
        - { name: table,  in: path,  required: true,  schema: { type: string }, description: Table or view name }
        - { name: select, in: query, required: false, schema: { type: string }, example: "id,invoice_number,total_inc_gst_cents" }
        - { name: order,  in: query, required: false, schema: { type: string }, example: "issue_date.desc" }
        - { name: limit,  in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Array of org-scoped rows
          content: { application/json: { schema: { type: array, items: { type: object } } } }
        "401":
          description: Missing/expired JWT
